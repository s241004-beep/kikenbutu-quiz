<!doctype html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#e8590c">
    <link rel="apple-touch-icon" href="icon-192.png">
    <title>危険物取扱者</title>
    <style>
        :root {
            --bg: #f7f5f0;
            --card: white;
            --text: #333;
            --sub: #888;
            --accent: #e8590c;
            --hover: #fff0e6;
            --note: #fff9db;
            --gray: #eee;
            --line: #ccc;
        }

        body.dark {
            --bg: #1e1e1e;
            --card: #2b2b2b;
            --text: #e8e8e8;
            --sub: #aaa;
            --accent: #ff7a2e;
            --hover: #3d2a1f;
            --note: #3a3520;
            --gray: #3a3a3a;
            --line: #555;
        }

        body {
            font-family: sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 16px;
            background-color: var(--bg);
            color: var(--text);
        }

        h1 {
            background-color: var(--accent);
            color: white;
            text-align: center;
            font-size: 22px;
            padding: 12px;
            border-radius: 10px;
        }

        button {
            display: block;
            width: 100%;
            padding: 14px;
            margin: 8px 0;
            font-size: 16px;
            background-color: var(--card);
            border: 2px solid var(--accent);
            border-radius: 10px;
            cursor: pointer;
            color: var(--text);
        }

        button:hover {
            background-color: var(--hover);
        }

        #question {
            background-color: var(--card);
            padding: 16px;
            border-radius: 12px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
            font-weight: bold;
            line-height: 1.6;
        }

        #score {
            text-align: right;
            color: var(--sub);
        }

        #result {
            font-weight: bold;
            font-size: 18px;
        }

        #explanation {
            background-color: var(--note);
            border-left: 4px solid #f59f00;
            padding: 12px;
            border-radius: 6px;
            line-height: 1.6;
        }

        #explanation:empty {
            display: none;
        }

        #controls {
            margin-top: 80px;
        }

        #controls button {
            background-color: var(--gray);
            font-size: 14px;
        }

        .review {
            background-color: var(--card);
            border-left: 4px solid #e03131;
            padding: 8px 12px;
            margin: 12px 0;
            border-radius: 6px;
            line-height: 1.6;
        }

        details {
            background-color: var(--card);
            border-radius: 8px;
            padding: 8px 12px;
            margin: 8px 0;
        }

        summary {
            font-weight: bold;
            cursor: pointer;
        }

        #exam-button,
        #exam-start {
            background-color: var(--accent);
            color: white;
            font-weight: bold;
            font-size: 18px;
            margin-top: 24px;
        }

        #exam-button:hover,
        #exam-start:hover {
            background-color: #d9480f;
        }

        .exam-info {
            background-color: var(--card);
            border-radius: 10px;
            padding: 12px 16px;
            line-height: 1.6;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        }

        #add-screen label {
            display: block;
            font-weight: bold;
            margin-top: 12px;
        }

        #add-screen input,
        #add-screen textarea,
        #add-screen select {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            font-size: 16px;
            border-radius: 8px;
            margin-top: 4px;
            border: 2px solid var(--line);
            background-color: var(--card);
            color: var(--text);
        }

        #my-list-items button {
            display: inline-block;
            width: auto;
            padding: 6px 16px;
            margin: 4px 8px 4px 0;
            font-size: 14px;
        }

        #otsu-buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        #otsu-buttons button {
            margin: 0;
        }

        #question,
        .review p {
            white-space: pre-wrap;
        }

        #set-size {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border: 2px solid var(--accent);
            border-radius: 8px;
            margin-bottom: 8px;
            background-color: var(--card);
            color: var(--text);
        }

        #progress {
            text-align: right;
            color: var(--accent);
            font-weight: bold;
            margin-bottom: 0;
        }

        #set-end-score {
            font-size: 24px;
            font-weight: bold;
            text-align: center;
        }

        #set-end-progress {
            text-align: center;
            color: var(--accent);
            font-weight: bold;
        }

        #reset-button {
            background-color: var(--gray);
            border-color: var(--line);
            font-size: 14px;
            margin-top: 24px;
        }
        #bookmark-button {
            display: block;
            width:auto;
            margin: 0 0 0 auto;
            padding: 6px 14px;
            font-size: 14px;
        }
        #bookmark-button.on {
            background-color: var(--accent);
            color: white;
        }
    </style>
</head>

<body>
    <h1>危険物一問一答</h1>


    <div id="modes">
        <label for="select-size">一回の出題数</label>
        <select id="set-size" onchange="localStorage.setItem(`setSize`, this.value)">
            <option value="all">全問</option>
            <option value="5">5問ずつ</option>
            <option value="10">10問ずつ</option>
        </select>
        <button onclick="startMode('all')">全科目</button>
        <button onclick="startMode('法令')">法令</button>
        <button onclick="startMode('物化')">物化</button>
        <button onclick="showRuiSelect()">性消</button>
        <button id="exam-button" onclick="showExamIntro()">📝 模擬試験(甲種・乙種対応)</button>
        <button onclick="showScreen(`add-screen`)">問題を追加</button>
        <button onclick="startBookmarks()">★ ブックマークした問題</button>
        <button onclick="showScreen(`setting`)">⚙️ 設定</button>
    </div>
    <div id="setting">
        <h2>設定</h2>

        <h3>表示</h3>
        <button id="dark-button" onclick="toggleDark()">🌙 ダークモード</button>

        <h3>データ</h3>
         <button id="reset-button" onclick="resetDecks()">🔄 〇問ずつの進み具合をリセット</button>

        <button onclick="backToMenu()">戻る</button>
    </div>
    <div id="my-list">
        <h2>自作の問題一覧</h2>
        <button onclick="showAddScreen()">新しく追加</button>
        <div id="my-list-items"></div>
        <button onclick="backToMenu()">戻る</button>
    </div>

    <div id="add-screen">
        <h2 id="add-title">問題追加</h2>
        <button onclick="showMyList()">自作問題一覧を見る</button>

        <label>科目</label>
        <select id="add-subject">
            <option value="法令">法令</option>
            <option value="物化">物化</option>
            <option value="性消">性消</option>
        </select>

        <label>類（性消）</label>
        <select id="add-rui">
            <option value="1">第1類</option>
            <option value="2">第2類</option>
            <option value="3">第3類</option>
            <option value="4">第4類</option>
            <option value="5">第5類</option>
            <option value="6">第6類</option>
        </select>

        <label>問題文</label>
        <textarea id="add-question" rows="4" cols="50"></textarea>

        <label>選択肢</label>
        <input type="text" id="add-choice0" placeholder="選択肢1">
        <input type="text" id="add-choice1" placeholder="選択肢2">
        <input type="text" id="add-choice2" placeholder="選択肢3">
        <input type="text" id="add-choice3" placeholder="選択肢4">
        <input type="text" id="add-choice4" placeholder="選択肢5">

        <label>正解</label>
        <select id="add-answer">
            <option value="0">選択肢1</option>
            <option value="1">選択肢2</option>
            <option value="2">選択肢3</option>
            <option value="3">選択肢4</option>
            <option value="4">選択肢5</option>
        </select>

        <label>解説</label>
        <textarea id="add-explanation" rows="4" cols="50"></textarea>

        <p id="add-message"></p>
        <button onclick="saveMyQuiz()">保存する</button>
        <button onclick="backToMenu()">戻る</button>
    </div>

    <div id="rui-select">
        <h2>性消：類を選択する</h2>
        <button onclick="startMode(`性消`)">全類</button>
        <button onclick="startRui(1)">第１類</button>
        <button onclick="startRui(2)">第２類</button>
        <button onclick="startRui(3)">第３類</button>
        <button onclick="startRui(4)">第4類</button>
        <button onclick="startRui(5)">第5類</button>
        <button onclick="startRui(6)">第6類</button>
        <button onclick="backToMenu()">戻る</button>
    </div>

    <div id="exam-intro">
        <h2>模擬試験</h2>
        <div class="exam-info">
            <p><b>本試験と同じ構成で出題します（ただし順不同）</b></p>
            <p><b>甲種</b>:法令15問・物化10問・性消20問</p>
            <p><b>乙種</b>:法令15問・物化10問・性消10問</p>
            <p><b>合格基準</b>各科目それぞれ60%以上の正答</p>
            <p>(本試験の試験時間は甲種2時間半乙種2時間)</p>
            <p>途中でモード選択に戻ると結果は記録されません</p>
        </div>
        <div id="last-result"></div>

        <button id="exam-start" onclick="startMode(`exam`)">甲種試験開始</button>
        <h3>乙種(類を選んで開始)</h3>
        <div id="otsu-buttons">
            <button onclick="startOtsuExam(1)">第１類</button>
            <button onclick="startOtsuExam(2)">第2類</button>
            <button onclick="startOtsuExam(3)">第3類</button>
            <button onclick="startOtsuExam(4)">第4類</button>
            <button onclick="startOtsuExam(5)">第5類</button>
            <button onclick="startOtsuExam(6)">第6類</button>
        </div>
        <button onclick="backToMenu()">戻る</button>
    </div>

    <div id="quiz-screen">
        <p id="progress"></p>
        <p id="score"></p>
        <button id="bookmark-button" onclick="toggleBookmark()">☆ ブックマーク</button>
        <p id="question"></p>
        <div id="choices"></div>
        <p id="result"></p>
        <p id="explanation"></p>
        <div id="controls">
            <button onclick="next()">次の問題</button>
            <button onclick="backToMenu()">モード選択</button>
        </div>
    </div>
    <div id="set-end">
        <h2>セット終了</h2>
        <p id="set-end-score"></p>
        <p id="set-end-progress"></p>
        <div id="set-end-wrongs"></div>
        <button id="set-continue" onclick="continueSet()">続ける</button>
        <button onclick="backToMenu()">モード選択に戻る</button>
    </div>

    <script>
        //問題データ
        const allQuizzes = [
            // ① 問題データ(甲種・乙種対応)
            // 性消の問題には rui(第何類の問題か)を付けています
            // ===== 最初の5問 =====
            {
                subject: "性消",
                rui: 5,
                question: "【性消】第5類の危険物に共通する性質はどれか。",
                choices: ["酸化性固体", "引火性液体", "自己反応性物質", "酸化性液体"],
                answer: 2,
                explanation: "第5類は自己反応性物質。分子内に酸素を含むものが多く、加熱や衝撃で自ら分解・燃焼する。"
            },
            {
                subject: "性消",
                rui: 1,
                question: "【性消】第1類の危険物について正しいものはどれか。",
                choices: ["それ自体は不燃性である", "それ自体がよく燃える", "強い還元性をもつ", "すべて液体である"],
                answer: 0,
                explanation: "第1類は酸化性固体。それ自体は燃えないが、酸素を放出して他の物質の燃焼を激しくする。"
            },
            {
                subject: "性消",
                rui: 3,
                question: "【性消】金属ナトリウムの保存方法として適切なものはどれか。",
                choices: ["水中に保存する", "灯油中に保存する", "エタノール中に保存する", "空気中で開放して保存する"],
                answer: 1,
                explanation: "ナトリウム(第3類)は水や空気中の水分と反応して水素を発生するため、灯油中に保存する。"
            },
            {
                subject: "物化",
                question: "【物化】メタン16gを完全燃焼させるのに必要な酸素は、標準状態で何Lか。",
                choices: ["11.2L", "22.4L", "44.8L", "67.2L"],
                answer: 2,
                explanation: "CH4 + 2O2 → CO2 + 2H2O より、メタン1mol(16g)に酸素2molが必要。2 × 22.4L = 44.8L"
            },
            {
                subject: "法令",
                question: "【法令】ガソリンの指定数量はどれか。",
                choices: ["200L", "400L", "1,000L", "2,000L"],
                answer: 0,
                explanation: "ガソリンは第4類第1石油類(非水溶性)で、指定数量は200L。"
            },

            // ===== 追加問題(甲種想定・20問) =====
            // ---- 法令(6問) ----
            {
                subject: "法令",
                question: "【法令】灯油の指定数量はどれか。",
                choices: ["200L", "400L", "1,000L", "2,000L"],
                answer: 2,
                explanation: "灯油は第4類第2石油類(非水溶性)で、指定数量は1,000L。軽油も同じ1,000L。"
            },
            {
                subject: "法令",
                question: "【法令】重油の指定数量はどれか。",
                choices: ["400L", "1,000L", "2,000L", "6,000L"],
                answer: 2,
                explanation: "重油は第4類第3石油類(非水溶性)で、指定数量は2,000L。"
            },
            {
                subject: "法令",
                question: "【法令】ガソリン400Lと灯油1,000Lを同一場所に貯蔵する場合、指定数量の倍数はいくらか。",
                choices: ["1.4", "2", "3", "5"],
                answer: 2,
                explanation: "ガソリン:400÷200=2、灯油:1,000÷1,000=1。倍数は合計して2+1=3。"
            },
            {
                subject: "法令",
                question: "【法令】危険物取扱者免状を交付するのは誰か。",
                choices: ["市町村長", "都道府県知事", "消防署長", "総務大臣"],
                answer: 1,
                explanation: "免状は、試験に合格した者に対して都道府県知事が交付する。"
            },
            {
                subject: "法令",
                question: "【法令】免状の書換えが必要になるのは、添付写真が撮影から何年を経過したときか。",
                choices: ["3年", "5年", "10年", "15年"],
                answer: 2,
                explanation: "写真が撮影から10年を経過したときは、免状の書換えを申請しなければならない。"
            },
            {
                subject: "法令",
                question: "【法令】危険物取扱作業に従事している者は、保安講習を受講した日以後の最初の4月1日から何年以内に次の講習を受講しなければならないか。",
                choices: ["1年以内", "2年以内", "3年以内", "5年以内"],
                answer: 2,
                explanation: "継続して従事している場合、前回受講日以後の最初の4月1日から3年以内ごとに受講する。"
            },

            // ---- 物理学及び化学(7問) ----
            {
                subject: "物化",
                question: "【物化】燃焼の三要素に含まれないものはどれか。",
                choices: ["可燃物", "酸素供給源", "点火源", "窒素"],
                answer: 3,
                explanation: "燃焼の三要素は、可燃物・酸素供給源・点火源(熱源)。窒素は燃焼に関与しない不燃性ガス。"
            },
            {
                subject: "物化",
                question: "【物化】引火点の説明として正しいものはどれか。",
                choices: [
                    "点火源がなくても自ら燃え出す最低の温度",
                    "点火源を近づけたとき、引火するのに十分な濃度の蒸気を液面上に発生する最低の液温",
                    "液体が沸騰を始める温度",
                    "燃焼が継続できる最高の温度"
                ],
                answer: 1,
                explanation: "引火点は点火源があって燃える最低の液温。点火源なしで燃え出す最低温度は発火点。"
            },
            {
                subject: "物化",
                question: "【物化】静電気が最も蓄積しやすい条件はどれか。",
                choices: ["湿度が高いとき", "湿度が低いとき", "流速が遅いとき", "導電率が高い物質のとき"],
                answer: 1,
                explanation: "湿度が低いと空気中の水分を通じて電荷が逃げにくく、静電気が蓄積しやすい。"
            },
            {
                subject: "物化",
                question: "【物化】太陽の熱が宇宙空間を通って地球に届く熱の移動を何というか。",
                choices: ["伝導", "対流", "放射", "蒸発"],
                answer: 2,
                explanation: "放射(ふく射)は、物質を介さずに電磁波として熱が伝わる移動の形式。"
            },
            {
                subject: "物化",
                question: "【物化】酸化と還元について正しいものはどれか。",
                choices: [
                    "物質が電子を失う変化を酸化という",
                    "物質が酸素を失う変化を酸化という",
                    "物質が水素と化合する変化を酸化という",
                    "酸化と還元は別々の反応で同時には起こらない"
                ],
                answer: 0,
                explanation: "酸化は電子を失う・酸素と化合する・水素を失う変化。酸化と還元は必ず同時に起こる。"
            },
            {
                subject: "物化",
                question: "【物化】プロパン(C3H8)1molを完全燃焼させるのに必要な酸素は何molか。",
                choices: ["2mol", "3mol", "4mol", "5mol"],
                answer: 3,
                explanation: "C3H8 + 5O2 → 3CO2 + 4H2O より、プロパン1molに酸素5molが必要。"
            },
            {
                subject: "物化",
                question: "【物化】pH3の水溶液の水素イオン濃度は、pH5の水溶液の何倍か。",
                choices: ["2倍", "10倍", "100倍", "1/100倍"],
                answer: 2,
                explanation: "pHが1小さいと水素イオン濃度は10倍。pHが2小さいので10×10=100倍。"
            },

            // ---- 性質・火災予防・消火(7問) ----
            {
                subject: "性消",
                rui: 2,
                question: "【性消】鉄粉・マグネシウムなど金属粉の火災に使用してはならない消火剤はどれか。",
                choices: ["乾燥砂", "膨張ひる石", "水", "膨張真珠岩"],
                answer: 2,
                explanation: "金属粉は水と反応して水素を発生することがあるため、注水は危険。乾燥砂などで窒息消火する。"
            },
            {
                subject: "性消",
                rui: 3,
                question: "【性消】黄りんの保存方法として適切なものはどれか。",
                choices: ["灯油中に保存する", "水中に保存する", "空気中で開放して保存する", "エタノール中に保存する"],
                answer: 1,
                explanation: "黄りんは空気中で自然発火するため、水中に保存して空気との接触を断つ。"
            },
            {
                subject: "性消",
                rui: 3,
                question: "【性消】炭化カルシウムが水と反応して発生する可燃性ガスはどれか。",
                choices: ["水素", "メタン", "アセチレン", "ホスフィン"],
                answer: 2,
                explanation: "炭化カルシウム(カーバイド)は水と反応してアセチレンを発生する。"
            },
            {
                subject: "性消",
                rui: 4,
                question: "【性消】第4類危険物の蒸気について一般的に正しいものはどれか。",
                choices: [
                    "空気より軽く、高い所に集まりやすい",
                    "空気より重く、低い所に滞留しやすい",
                    "空気と同じ重さで、均一に広がる",
                    "水に溶けて消える"
                ],
                answer: 1,
                explanation: "第4類の蒸気比重はほとんどが1より大きく、低所に滞留しやすいため換気に注意する。"
            },
            {
                subject: "性消",

        //問題を画面に表示する
        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                const temp = array[i];
                array[i] = array[j];
                array[j] = temp;
            }
        }
        function pickRandom(subject, count) {
            const list = allQuizzes.filter(function (quiz) {
                return quiz.subject === subject;
            });
            shuffle(list);
            return list.slice(0, count);
        }
        function pickRandomRui(rui, count) {
            const list = allQuizzes.filter(function (quiz) {
                return quiz.subject === "性消" && quiz.rui === rui;
            });
            shuffle(list);
            return list.slice(0, count);

        function getSetSize() {
            const value = document.getElementById("set-size").value;
            if (value === "all") {
                return 0;
            }
            return Number(value);
        }

        function getPool(info) {
            if (info.mode === "all") {
                return allQuizzes;
            }
            return allQuizzes.filter(function (quiz) {
                if (info.rui) {
                    return quiz.subject === "性消" && quiz.rui === info.rui;
                }
                return quiz.subject === info.mode;
            });
        }

        function takeFromDeck(info, size) {
            const pool = getPool(info);
            const deckKey = "deck-" + info.key;
            const roundKey = "round-" + info.key;

            let deck = JSON.parse(localStorage.getItem(deckKey) || "[]");
            let round = Number(localStorage.getItem(roundKey) || "1");

            deck = deck.filter(function (text) {
                return pool.some(function (q) {
                    return q.question === text;
                });
            });

            if (deck.length === 0) {
                if (localStorage.getItem(deckKey) !== null) {
                    round++;
                }
                deck = pool.map(function (q) {
                    return q.question;
                });
                shuffle(deck);
            }

            const taken = deck.slice(0, size);
            const rest = deck.slice(size);
            localStorage.setItem(deckKey, JSON.stringify(rest));
            localStorage.setItem(roundKey, String(round));

            remainingCount = rest.length;
            progressText = round + "周目あと" + rest.length + "問(全" + pool.length + "問)";

            return taken.map(function (text) {
                return pool.find(function (q) {
                    return q.question === text;
                });
            });
        }

            setInfo = info;

                backToMenu();

            isExam = false;

        function startMode(mode) {

            if (size > 0 && mode !== "exam") {
                startSet({ key: mode, mode: mode }, size);
                return;
            }
            if (mode === "all") {
                quizzes = allQuizzes;
            } else if (mode === "exam") {
                quizzes = pickRandom("法令", 15).concat(
                    pickRandom("物化", 10),
                    pickRandom("性消", 20)

                examKey = "lastExam";
                examTitle = "甲種";

                });
            }
            isExam = (mode === "exam");
            beginQuiz();
        }

        function deleteMyQuiz(i) {
            if (!confirm("この問題を削除しますか？")) {
                return;

            const q = myQuizzes[i];
            const pos = allQuizzes.indexOf(q);
            if (pos !== -1) {
                allQuizzes.splice(pos, 1);
            }
            myQuizzes.splice(i, 1);
            saveMyQuizzesToStorage();
            showMyList();
        }

        //入力した問題を保存するよん
        function saveMyQuiz() {
            const subject = document.getElementById("add-subject").value;
            const question = document.getElementById("add-question").value.trim();
            const explanation = document.getElementById("add-explanation").value.trim();
            const answer = Number(document.getElementById("add-answer").value);
            const message = document.getElementById("add-message");

            const choices = [];
            for (let i = 0; i < 5; i++) {
                choices.push(document.getElementById("add-choice" + i).value.trim());
            }
            if (choices[4] === "") {
                choices.pop();
            }

            if (question === "" || choices.includes("")) {
                message.textContent = "問題文と選択肢1~4をすべて入力してください";
                message.style.color = "red";
                return;
            }

            if (answer >= choices.length) {
                message.textContent ="正解に選んだ選択肢が入力されていません";
                message.style.color = "red";
                return;
            }

            const quiz = {
                subject: subject,
                question: "【" + subject + "】" + question,
                choices: choices,
                answer: answer,
                explanation: explanation || "(解説なし)",
                mine: true
            };
            if (subject === "性消") {
                quiz.rui = Number(document.getElementById("add-rui").value);
            }

            if (editingIndex >= 0) {
                const old = myQuizzes[editingIndex];
                const pos = allQuizzes.indexOf(old);
                if (pos !== -1) {
                    allQuizzes[pos] = quiz;
                }
                saveMyQuizzesToStorage();
                editingIndex = -1;
                showMyList();
                return;
            }

            allQuizzes.push(quiz);
            myQuizzes.push(quiz);
            saveMyQuizzesToStorage();

            message.textContent = "保存しました(自作問題:" + myQuizzes.length + "問)";
            message.style.color = "green";

           clearAddForm();
        }

            const order = [];
            for (let i = 0; i < quiz.choices.length; i++) {
                order.push(i);

            if (!quiz.noShuffle) {
                shuffle(order);
            }

            for (let k = 0; k < order.length; k++) {

                };
                choicesDiv.appendChild(button);

        //答え合わせ
        function check(index) {
            if (answered) return;
            answered = true;
            const quiz = quizzes[current];
            const result = document.getElementById("result");
            const explanation = document.getElementById("explanation");
            explanation.textContent = quiz.explanation;
            if (index === quiz.answer) {
                result.textContent = "正解!";
                result.style.color = "green";
                score++;
                correctBySubject[quiz.subject]++;
            } else {
                result.textContent = "不正解...正解は「" + quiz.choices[quiz.answer] + "」です";
                result.style.color = "red";
                wrongQuizzes.push(quiz);
            }
            updateScore();
        }

        //モード選択から始動
        document.getElementById("set-size").value = localStorage.getItem("setSize") || "all";

        const saveDark = localStorage.getItem("dark");
        if (saveDark === "1" ||
            (saveDark === null && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
            document.body.classList.add("dark");
        }
        updateDarkButton();

        backToMenu();
        function showExamIntro() {
            showScreen("exam-intro");

            const saved = localStorage.getItem("lastExam");
            const lastResult = document.getElementById("last-result");
            if (saved) {
                lastResult.innerHTML = "<h3>前回の成績</h3>" + saved;
            } else {
                lastResult.innerHTML = "<p>まだ受験記録はありません</p>";
            }
        }
        function showRuiSelect() {
            showScreen("rui-select");
        }
        function showExamResult() {
            const subjects = ["法令", "物化", "性消"];
            let text = "";
            let allPass = true;
            for (let i = 0; i < subjects.length; i++) {
                const s = subjects[i];
                const total = quizzes.filter(function (quiz) {
                    return quiz.subject === s;
                }).length;
                const correct = correctBySubject[s];
                let rate = 0;
                if (total > 0) {
                    rate = Math.floor(correct / total * 100);
                }
                const pass = correct * 10 >= total * 6;
                if (!pass) {
                    allPass = false;
                }
                text += s + ":" + correct + "/" + total + "(" + rate + "%)" + (pass ? "o" : "x") + "<br>";
            }
            const now = new Date().toLocaleString("ja-JP");
            const summary = "<p>" + now + "</p>" + text
                + "<p><b>" + (allPass ? "合格" : "不合格") + "</b></p>";
            localStorage.setItem("lastExam", summary);
            text += "<h3>間違えた問題(" + wrongQuizzes.length + "問)</h3>";
            if (wrongQuizzes.length === 0) {
                text += "<p>全問正解です</p>";
            }
            for (let i = 0; i < wrongQuizzes.length; i++) {
                const s = subjects[i];
                const wrongs = wrongQuizzes.filter(function (quiz) {
                    return quiz.subject === s;
                });
                if (wrongs.length === 0) {
                    continue;
                }
                text += "<details>";
                text += "<summary>" + s + "(" + wrongs.length + "問)</summary>";
                for (let j = 0; j < wrongs.length; j++) {
                    const q = wrongs[j];
                    text += "<div class=`review`>"
                        + "<p>" + q.question + "</p>"
                        + "<p>正解:" + q.choices[q.answer] + "</p>"
                        + "<p>" + q.explanation + "</p>"
                        + "<div>";
                }
                text += "</details>";
            }
            document.getElementById("question").textContent = "模擬試験 結果";
            document.getElementById("choices").innerHTML = text;
            document.getElementById("explanation").textContent = "";
            const result = document.getElementById("result");
            if (allPass) {
                result.textContent = "合格";
                result.style.color = "green";
            } else {
                result.textContent = "不合格...60%未満の科目を復習しましょう";
                result.style.color = "red";
            }
        }
        // サービスワーカーを登録する
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("sw.js");
        }
    </script>
</body>

</html>
